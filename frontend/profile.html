<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Profile | RecipeAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --primary-blue: #007bff;
      --primary-blue-dark: #0056b3;
      --bg: #f5f7fa;
      --bg-white: #ffffff;
      --text-dark: #333333;
      --text-muted: #666666;
      --border-color: #e0e0e0;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Manrope", sans-serif;
      background-color: var(--bg);
      min-height: 100vh;
      color: var(--text-dark);
    }

    /* Top Navigation */
    .topbar {
      background: var(--bg-white);
      border-bottom: 1px solid var(--border-color);
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .topbar .brand {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--primary-blue);
      text-decoration: none;
    }

    .topbar .nav-links {
      display: flex;
      align-items: center;
      gap: 1rem;
    }

    .topbar .nav-links a {
      text-decoration: none;
      color: var(--text-muted);
      font-weight: 600;
      font-size: 0.9rem;
      padding: 0.6rem 1rem;
      border-radius: 10px;
      transition: all 0.2s ease;
    }

    .topbar .nav-links a:hover {
      background: #f0f4ff;
      color: var(--primary-blue);
    }

    .logout-btn {
      background: #fff5f5;
      color: #dc3545;
      border: 1px solid #fecaca;
      padding: 0.6rem 1.2rem;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .logout-btn:hover {
      background: #dc3545;
      color: #fff;
      border-color: #dc3545;
    }

    /* Main Content */
    .profile-container {
      max-width: 900px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }

    /* Profile Header Card */
    .profile-header {
      background: var(--bg-white);
      border-radius: 20px;
      padding: 3rem;
      display: flex;
      align-items: center;
      gap: 2.5rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from { opacity: 0; transform: translateY(15px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, #007bff, #0056b3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.5rem;
      font-weight: 800;
      color: #fff;
      flex-shrink: 0;
    }

    .profile-info h1 {
      font-size: 1.8rem;
      font-weight: 800;
      margin-bottom: 0.3rem;
    }

    .profile-info .email {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 0.8rem;
    }

    .profile-info .join-date {
      color: var(--text-muted);
      font-size: 0.85rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    /* Stats Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1.25rem;
      margin-top: 2rem;
    }

    .stat-card {
      background: var(--bg-white);
      border-radius: 16px;
      padding: 1.5rem;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
      animation: slideIn 0.6s ease-out;
    }

    .stat-card:nth-child(2) { animation-delay: 0.1s; }
    .stat-card:nth-child(3) { animation-delay: 0.2s; }

    .stat-card .stat-value {
      font-size: 2rem;
      font-weight: 800;
      color: var(--primary-blue);
    }

    .stat-card .stat-label {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 0.3rem;
      font-weight: 600;
    }

    /* Quick Actions */
    .quick-actions {
      margin-top: 2rem;
      background: var(--bg-white);
      border-radius: 20px;
      padding: 2rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
    }

    .quick-actions h2 {
      font-size: 1.2rem;
      margin-bottom: 1.25rem;
    }

    .actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
    }

    .action-card {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.2rem;
      border: 1.5px solid var(--border-color);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text-dark);
      transition: all 0.2s ease;
    }

    .action-card:hover {
      border-color: var(--primary-blue);
      background: #f0f4ff;
      transform: translateY(-2px);
    }

    .action-card .action-icon {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #f0f4ff;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary-blue);
      flex-shrink: 0;
    }

    .action-card .action-text strong {
      display: block;
      font-size: 0.95rem;
    }

    .action-card .action-text span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    /* Loading state */
    .loading-state {
      text-align: center;
      padding: 5rem 2rem;
      color: var(--text-muted);
      font-size: 1.1rem;
    }

    @media (max-width: 640px) {
      .profile-header {
        flex-direction: column;
        text-align: center;
        padding: 2rem;
      }

      .profile-info .join-date {
        justify-content: center;
      }
    }
  </style>
</head>

<body>
  <!-- Top Bar -->
  <nav class="topbar">
    <a href="index.html" class="brand">RecipeAI</a>
    <div class="nav-links">
      <a href="recipes.html">Home</a>
      <a href="veg.html">Recipes</a>
      <button class="logout-btn" id="logoutBtn">Log Out</button>
    </div>
  </nav>

  <!-- Loading State -->
  <div id="loadingState" class="loading-state">
    Loading your profile...
  </div>

  <!-- Profile Content (hidden until loaded) -->
  <div class="profile-container" id="profileContent" style="display: none;">
    <div class="profile-header">
      <div class="avatar" id="avatarInitial">?</div>
      <div class="profile-info">
        <h1 id="profileName">â€”</h1>
        <p class="email" id="profileEmail">â€”</p>
        <p class="join-date">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          Member since <span id="profileDate">â€”</span>
        </p>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-value">0</div>
        <div class="stat-label">Saved Recipes</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">50+</div>
        <div class="stat-label">Recipes Available</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">âˆž</div>
        <div class="stat-label">Ingredients Searched</div>
      </div>
    </div>

    <div class="quick-actions">
      <h2>Quick Actions</h2>
      <div class="actions-grid">
        <a href="veg.html" class="action-card">
          <div class="action-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 016.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 014 19.5v-15A2.5 2.5 0 016.5 2z"/></svg>
          </div>
          <div class="action-text">
            <strong>Browse Recipes</strong>
            <span>Explore all collections</span>
          </div>
        </a>
        <a href="index.html" class="action-card">
          <div class="action-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </div>
          <div class="action-text">
            <strong>Search Recipes</strong>
            <span>Find by ingredient</span>
          </div>
        </a>
        <a href="veg-telugu.html" class="action-card">
          <div class="action-icon">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
          </div>
          <div class="action-text">
            <strong>Telugu Recipes</strong>
            <span>Regional favorites</span>
          </div>
        </a>
      </div>
    </div>
  </div>

  <script src="assets/js/api-config.js"></script>
  <script>
    const AUTH_TOKEN_KEY = "recipeai_token";
    const profileContent = document.getElementById("profileContent");
    const loadingState = document.getElementById("loadingState");
    const logoutBtn = document.getElementById("logoutBtn");

    async function loadProfile() {
      try {
        const token = localStorage.getItem(AUTH_TOKEN_KEY);
        if (!token) {
          window.location.href = "login.html";
          return;
        }

        const res = await fetch(API_BASE + "/api/me", {
          headers: { Authorization: `Bearer ${token}` },
        });

        if (!res.ok) {
          if (res.status === 401) {
            localStorage.removeItem(AUTH_TOKEN_KEY);
          }
          // Not logged in â†’ redirect to login
          window.location.href = "login.html";
          return;
        }

        const data = await res.json();
        const user = data.user;

        document.getElementById("profileName").textContent = user.username;
        document.getElementById("profileEmail").textContent = user.email;
        document.getElementById("avatarInitial").textContent = user.username.charAt(0).toUpperCase();

        const date = new Date(user.created_at);
        document.getElementById("profileDate").textContent = date.toLocaleDateString("en-US", {
          year: "numeric",
          month: "long",
          day: "numeric",
        });

        loadingState.style.display = "none";
        profileContent.style.display = "block";
      } catch (err) {
        loadingState.textContent = "Could not connect to server. Make sure it is running.";
      }
    }

    logoutBtn.addEventListener("click", async () => {
      localStorage.removeItem(AUTH_TOKEN_KEY);
      try {
        await fetch(API_BASE + "/api/logout", { method: "POST" });
      } catch (e) {}
      window.location.href = "login.html";
    });

    loadProfile();
  </script>
</body>

</html>
