<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | RecipeAI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <style>
    :root {
      --primary-blue: #007bff;
      --primary-blue-dark: #0056b3;
      --bg-white: #ffffff;
      --text-dark: #333333;
      --text-muted: #666666;
      --border-color: #e0e0e0;
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
      --success: #28a745;
      --danger: #dc3545;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Manrope", sans-serif;
      background-color: var(--bg-white);
      height: 100vh;
      overflow-x: hidden;
      overflow-y: hidden;
    }

    .login-container {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* Left Side: Illustration */
    .illustration-side {
      flex: 0 0 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-white);
      padding: 0;
      overflow: hidden;
    }

    .illustration-side img {
      width: 100%;
      height: 100%;
      max-width: none;
      object-fit: cover;
      object-position: left center;
      display: block;
    }

    /* Right Side: Login Form */
    .form-side {
      flex: 0 0 50%;
      background-color: var(--primary-blue);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 1.25rem;
      overflow: hidden;
    }

    /* Decorative bottom curve */
    .form-side::after {
      content: "";
      position: absolute;
      bottom: -100px;
      right: -100px;
      width: 400px;
      height: 400px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      pointer-events: none;
    }

    .login-card {
      background: var(--bg-white);
      border-radius: 20px;
      padding: 2.2rem 2rem;
      width: 100%;
      max-width: 400px;
      max-height: calc(100vh - 2.5rem);
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
      z-index: 10;
      animation: slideIn 0.6s ease-out;
      overflow: auto;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(30px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .login-card h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: var(--text-dark);
      margin-bottom: 0.5rem;
    }

    .login-card p.subtitle {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 2rem;
    }

    .form-group {
      margin-bottom: 1.5rem;
      position: relative;
    }

    .form-group input {
      width: 100%;
      padding: 1.1rem 1.1rem 1.1rem 3.2rem;
      border: 1.5px solid var(--border-color);
      border-radius: 30px;
      font-size: 0.9rem;
      transition: all 0.3s ease;
      outline: none;
      font-family: inherit;
    }

    .form-group input:focus {
      border-color: var(--primary-blue);
      box-shadow: 0 0 0 4px rgba(0, 123, 255, 0.1);
    }

    .form-group .icon {
      position: absolute;
      left: 1.2rem;
      top: 50%;
      transform: translateY(-50%);
      color: #999;
      display: flex;
      align-items: center;
    }

    /* Alert Messages */
    .alert {
      padding: 0.9rem 1rem;
      border-radius: 12px;
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      display: none;
      animation: alertFadeIn 0.3s ease-out;
    }

    @keyframes alertFadeIn {
      from { opacity: 0; transform: translateY(-6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .alert.alert-error {
      background: #fff5f5;
      color: var(--danger);
      border: 1px solid #fecaca;
      display: block;
    }

    .alert.alert-success {
      background: #f0fdf4;
      color: var(--success);
      border: 1px solid #bbf7d0;
      display: block;
    }

    .login-btn {
      width: 100%;
      background-color: var(--primary-blue);
      color: #fff;
      padding: 1.1rem;
      border: none;
      border-radius: 30px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease, transform 0.2s ease;
      margin-top: 1rem;
      box-shadow: 0 8px 20px rgba(0, 123, 255, 0.3);
      font-family: inherit;
    }

    .login-btn:hover {
      background-color: var(--primary-blue-dark);
      transform: translateY(-2px);
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .forgot-password {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 600;
      transition: color 0.2s ease;
    }

    .forgot-password:hover {
      color: var(--primary-blue);
    }

    .signup-link {
      text-align: center;
      margin-top: 1rem;
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    .signup-link a {
      color: var(--primary-blue);
      font-weight: 700;
      text-decoration: none;
    }

    .signup-link a:hover {
      text-decoration: underline;
    }

    .back-to-home {
      position: absolute;
      top: 1rem;
      left: 2rem;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      z-index: 100;
    }

    .back-to-home:hover {
      color: var(--primary-blue);
    }

    /* Responsive */
    @media (max-width: 992px) {
      .illustration-side {
        display: none;
      }

      .form-side {
        flex: 1;
        padding: 1rem;
      }

      .back-to-home {
        top: 0.75rem;
        left: 1rem;
      }
    }

    @media (max-width: 480px) {
      .login-card {
        padding: 2.5rem 1.5rem;
      }
    }
  </style>
</head>

<body>
  <div class="login-container">
    <a href="index.html" class="back-to-home">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7" />
      </svg>
      Back to Home
    </a>

    <!-- Left Illustration -->
    <div class="illustration-side">
      <img src="assets/images/login-bg.png" alt="Recipes Illustration" />
    </div>

    <!-- Right Form Section -->
    <div class="form-side">
      <div class="login-card">
        <h1>Welcome Back!</h1>
        <p class="subtitle">Sign in to your RecipeAI account</p>

        <div id="alertBox" class="alert"></div>

        <form id="loginForm">
          <div class="form-group">
            <span class="icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z" />
                <polyline points="22,6 12,13 2,6" />
              </svg>
            </span>
            <input type="email" id="loginEmail" placeholder="Email Address" required />
          </div>

          <div class="form-group">
            <span class="icon">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
            </span>
            <input type="password" id="loginPassword" placeholder="Password" required />
          </div>

          <button type="submit" class="login-btn" id="loginBtn">Login</button>
        </form>

        <a href="#" class="forgot-password">Forgot Password?</a>
        <p class="signup-link">Don't have an account? <a href="signup.html">Sign Up</a></p>
      </div>
    </div>
  </div>

  <script src="assets/js/api-config.js"></script>
  <script>
    const AUTH_TOKEN_KEY = "recipeai_token";
    const form = document.getElementById("loginForm");
    const alertBox = document.getElementById("alertBox");
    const loginBtn = document.getElementById("loginBtn");

    async function checkExistingLogin() {
      const token = localStorage.getItem(AUTH_TOKEN_KEY);
      if (!token) {
        return;
      }

      try {
        const res = await fetch(API_BASE + "/api/me", {
          headers: { Authorization: `Bearer ${token}` },
        });

        if (res.ok) {
          window.location.href = "recipes.html";
        } else {
          localStorage.removeItem(AUTH_TOKEN_KEY);
        }
      } catch (_err) {
        // Keep user on login page if server is unavailable.
      }
    }

    checkExistingLogin();

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      alertBox.className = "alert";
      alertBox.textContent = "";

      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      if (!email || !password) {
        alertBox.textContent = "Please enter both email and password.";
        alertBox.className = "alert alert-error";
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = "Signing in...";

      try {
        const res = await fetch(API_BASE + "/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          alertBox.textContent = data.error || "Invalid credentials.";
          alertBox.className = "alert alert-error";
          loginBtn.disabled = false;
          loginBtn.textContent = "Login";
          return;
        }

        if (data.token) {
          localStorage.setItem(AUTH_TOKEN_KEY, data.token);
        }

        alertBox.textContent = "Login successful! Redirecting...";
        alertBox.className = "alert alert-success";
        setTimeout(() => {
          window.location.href = "recipes.html";
        }, 800);
      } catch (err) {
        alertBox.textContent = "Server error. Make sure the server is running.";
        alertBox.className = "alert alert-error";
        loginBtn.disabled = false;
        loginBtn.textContent = "Login";
      }
    });
  </script>
</body>

</html>
